name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check files
        run: |
          ls -la

      - name: Extract ZIP
        run: |
          unzip -o Hamster_AI_build_ready.zip -d project
          find project -name "settings.gradle.kts"

      - name: Build APK
        run: |
          cd $(dirname $(find project -name "settings.gradle.kts"))
          chmod +x gradlew || true
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamster-APK
          path: "**/build/outputs/apk/debug/*.apk"
